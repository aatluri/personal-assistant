[pytest]
pythonpath = .
testpaths = tests

# Live tests (files ending in _e2e.py) are marked "e2e" by tests/conftest.py
# and skipped by default. Run them deliberately with: pytest -m e2e
markers =
    e2e: live test that uses the real Google Sheet, Google Drive, OpenAI or a running server
addopts = -m "not e2e"
